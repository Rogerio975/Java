# ============================================================
#  Configurações de Conexão — Active Directory (LDAP)
#  Copie este arquivo para ad-config.properties e preencha.
# ============================================================

# Endereço do Domain Controller
# Pode ser o IP (192.168.1.10) ou o FQDN (dc01.empresa.local)
ad.host=dc01.empresa.local

# Porta LDAP padrão = 389 | LDAPS (SSL) = 636
ad.port=389

# Base de busca — substitua pelo domínio da sua empresa
# Exemplo: empresa.local  →  DC=empresa,DC=local
# Exemplo: corp.empresa.com.br  →  DC=corp,DC=empresa,DC=com,DC=br
ad.searchBase=DC=empresa,DC=local

# Conta de serviço para autenticação (bind)
# Use o formato UPN (user@domain) ou DN completo
# Exemplo UPN:  svc-ldap@empresa.local
# Exemplo DN:   CN=svc-ldap,OU=Servicos,DC=empresa,DC=local
ad.bindDn=svc-ldap@empresa.local

# Senha da conta de serviço
ad.bindPassword=SuaSenhaAqui

# Usar SSL/TLS? (LDAPS na porta 636)
# Para usar, também configure o certificado no Java truststore
ad.ssl=false

# Número máximo de resultados por busca
ad.maxResults=20

# ============================================================
#  ALTERNATIVA: Variáveis de Ambiente
#  As seguintes env vars têm prioridade sobre este arquivo:
#    AD_HOST, AD_PORT, AD_BASE, AD_BIND_DN, AD_PASSWORD, AD_SSL, AD_MAX
# ============================================================
