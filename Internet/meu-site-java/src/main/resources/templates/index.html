<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site em Java</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { color: #333; }
        p { color: #666; }
    </style>
</head>
<body>
    <div class="card">
        <!-- O Thymeleaf substitui o conteúdo das tags pelos valores vindos do Java -->
        <h1 th:text="${mensagem}">Título Padrão</h1>
        <p>Olá, <span th:text="${usuario}">Visitante</span>! Esta página foi renderizada pelo servidor Java.</p>
        <p>Data: <span th:text="${data}">01/01/2026</span></p>
        <p>Horário: <span th:text="${horario}">00:00:00</span></p>
    </div>
</body>
</html>
